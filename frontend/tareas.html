<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Actividades · AlephOne</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/aleph-shell.css?v=3">
<style>
.main-inner{max-width:1180px}
.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:18px;flex-wrap:wrap;padding:26px 4px 18px}
.eyebrow{font-family:'Syne',sans-serif;font-size:0.78rem;font-weight:800;letter-spacing:0.14em;text-transform:uppercase;color:var(--primary-ink,rgb(var(--primary-rgb)))}
.title{font-family:'Syne',sans-serif;font-size:clamp(1.6rem,1.2rem + 1.4vw,2.2rem);font-weight:800;line-height:1.1;margin-top:6px}
.subtitle{font-size:0.92rem;color:var(--muted);margin-top:6px}
.ctx{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.updated{font-size:0.8rem;color:var(--faint);min-width:0}

/* Resumen */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
.stat{display:flex;flex-direction:column;gap:4px;padding:16px 18px;text-align:left;width:100%}
.stat-btn{transition:transform 220ms var(--e-out),box-shadow 220ms var(--e-out)}
.stat-btn:active{transform:scale(0.985)}
.stat-label{font-size:0.84rem;color:var(--muted)}
.stat-value{font-family:'Syne',sans-serif;font-size:1.7rem;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.stat-detail{font-size:0.78rem;color:var(--faint)}

/* Barra de filtros */
.toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-bottom:14px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.fchip{min-height:40px;padding:0 14px;border-radius:999px;background:var(--chip-bg);border:1px solid var(--chip-border);font-size:0.88rem;font-weight:600;color:var(--muted);transition:background 150ms ease,border-color 150ms ease,color 150ms ease}
.fchip[aria-pressed="true"]{background:rgba(var(--primary-rgb),0.20);border-color:rgba(var(--primary-rgb),0.6);color:var(--primary-ink,rgb(var(--primary-rgb)))}
.fchip .n{margin-left:7px;opacity:0.75;font-variant-numeric:tabular-nums}
.search{position:relative}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--faint);pointer-events:none}
.search input{min-height:42px;width:min(260px,100%);padding:0 12px 0 36px;border-radius:12px;background:var(--field-bg);border:1px solid var(--glass-border);color:var(--text);font-size:1rem;outline:none}
.search input:focus{border-color:rgba(var(--primary-rgb),0.85);box-shadow:0 0 0 3px rgba(var(--primary-rgb),0.24)}

.grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(290px,0.8fr);gap:16px;align-items:start}
.group + .group{margin-top:20px}
.group-head{display:flex;align-items:center;gap:8px;font-family:'Syne',sans-serif;font-size:0.92rem;font-weight:800;margin:0 4px 10px}
.group-head span{font-family:'DM Sans',sans-serif;font-size:0.8rem;font-weight:600;color:var(--faint)}
.act-list{display:flex;flex-direction:column;gap:10px}

/* Actividad */
.act{position:relative;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px 16px 14px 22px;border-radius:18px;background:var(--noise),linear-gradient(180deg,var(--gloss),transparent 46%),var(--glass);border:1px solid var(--glass-border);box-shadow:inset 0 1px 0 var(--edge-hi),0 1px 2px rgba(var(--shadow-rgb),0.22);transition:transform 220ms var(--e-out),border-color 160ms ease}
.act-bar{position:absolute;left:8px;top:14px;bottom:14px;width:4px;border-radius:4px;background:rgb(var(--primary-rgb))}
.act.late .act-bar{background:var(--danger)}
.act.urgent .act-bar{background:var(--danger)}
.act.soon .act-bar{background:var(--warn)}
.act.done .act-bar{background:var(--ok)}
.act-main{display:flex;flex-direction:column;gap:6px;text-align:left;min-width:0;padding:2px 0;border-radius:10px}
.act-title{font-size:1rem;font-weight:700;line-height:1.3;overflow-wrap:anywhere}
.act-meta{display:flex;align-items:center;flex-wrap:wrap;gap:8px;font-size:0.84rem;color:var(--muted)}
.act-side{display:flex;flex-direction:column;align-items:flex-end;gap:6px;text-align:right}
.act-due{font-family:'Syne',sans-serif;font-size:0.9rem;font-weight:800}
.act-due.late,.act-due.urgent{color:var(--danger)}
.act-due.soon{color:var(--warn)}
.act-due.done{color:var(--ok)}
.act-sub{font-size:0.78rem;color:var(--faint);margin-top:-4px}

.empty{display:flex;flex-direction:column;align-items:center;gap:12px;padding:34px 18px;text-align:center;color:var(--muted);line-height:1.5}
.empty p{max-width:42ch}
.empty-ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:rgba(var(--primary-rgb),0.14);color:var(--primary-ink,rgb(var(--primary-rgb)))}
.empty-ic svg{width:22px;height:22px}
.muted{color:var(--muted)}
.inline-load{display:flex;align-items:center;flex-wrap:wrap;gap:10px;padding:4px 4px 14px;font-size:0.92rem;color:var(--muted)}
.inline-load .spin{width:18px;height:18px;border-radius:50%;border:2.5px solid rgba(var(--primary-rgb),0.25);border-top-color:rgb(var(--primary-rgb));animation:spin 800ms linear infinite}
.inline-load .slow{flex-basis:100%;font-size:0.84rem;color:var(--faint)}
.stats.sk{margin-bottom:16px}
.sk-list{display:flex;flex-direction:column;gap:10px}
.err-card{padding:22px 24px;max-width:600px}
.err-card h3{font-family:'Syne',sans-serif;font-size:1.05rem;font-weight:800;margin-bottom:8px}
.err-card p{line-height:1.5;margin-bottom:14px;color:var(--muted)}

/* Columna lateral */
.side{display:flex;flex-direction:column;gap:16px}
.side-card{padding:18px 20px}
.side-title{font-family:'Syne',sans-serif;font-size:0.95rem;font-weight:800;margin-bottom:12px}
.next-title{font-size:1rem;font-weight:700;line-height:1.3;overflow-wrap:anywhere}
.next-meta{font-size:0.84rem;color:var(--muted);margin-top:3px}
.countdown{font-family:'Syne',sans-serif;font-size:1.5rem;font-weight:800;margin:10px 0 12px;font-variant-numeric:tabular-nums}
.proj{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.proj-val{font-family:'Syne',sans-serif;font-size:2rem;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.proj-copy{font-size:0.86rem;line-height:1.45;color:var(--muted)}
.gauge{position:relative;height:8px;border-radius:8px;background:var(--track);margin:14px 0 4px}
.gauge i{position:absolute;left:0;top:0;bottom:0;border-radius:8px;background:rgb(var(--primary-rgb));transition:width 500ms var(--e-out)}
.gauge b{position:absolute;top:-4px;bottom:-4px;width:2px;border-radius:2px;background:var(--text);opacity:0.7}
.goal-row{display:flex;align-items:center;gap:6px;margin-top:12px;font-size:0.84rem;color:var(--muted);flex-wrap:wrap}
.gchip{min-width:44px;min-height:40px;padding:0 10px;border-radius:12px;background:var(--chip-bg);border:1px solid var(--chip-border);font-weight:700;color:var(--muted)}
.gchip[aria-pressed="true"]{background:rgba(var(--primary-rgb),0.20);border-color:rgba(var(--primary-rgb),0.6);color:var(--primary-ink,rgb(var(--primary-rgb)))}
.fb-item{display:block;width:100%;text-align:left;padding:10px 0;border-top:1px solid var(--glass-border)}
.fb-item:first-of-type{border-top:0;padding-top:0}
.fb-top{display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:700;font-size:0.9rem}
.fb-snip{font-size:0.84rem;color:var(--muted);margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.dist{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.dist-row{display:grid;grid-template-columns:44px 1fr 26px;gap:8px;align-items:center;font-size:0.8rem;color:var(--muted)}
.dist-bar{height:8px;border-radius:8px;background:var(--track);overflow:hidden}
.dist-bar i{display:block;height:100%;border-radius:8px;background:rgb(var(--primary-rgb))}
.join{display:flex;gap:8px}
.join input{flex:1;min-width:0;min-height:44px;padding:0 12px;border-radius:12px;background:var(--field-bg);border:1px solid var(--glass-border);color:var(--text);font-size:1rem;letter-spacing:0.08em;text-transform:uppercase;outline:none}
.join input::placeholder{text-transform:none;letter-spacing:0;color:var(--faint)}
.join input:focus{border-color:rgba(var(--primary-rgb),0.85);box-shadow:0 0 0 3px rgba(var(--primary-rgb),0.24)}

/* Detalle (panel lateral) */
.d-chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.d-sub{font-size:0.9rem;color:var(--muted);margin-top:4px}
.d-meta{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 18px}
.d-meta div{padding:12px 14px;border-radius:14px;background:var(--chip-bg);border:1px solid var(--chip-border)}
.d-meta dt{font-size:0.78rem;color:var(--muted);margin-bottom:3px}
.d-meta dd{font-size:0.94rem;font-weight:700;overflow-wrap:anywhere}
.d-h{font-family:'Syne',sans-serif;font-size:0.95rem;font-weight:800;margin:18px 0 8px}
.d-warn{padding:10px 12px;border-radius:12px;background:rgba(240,184,128,0.14);border:1px solid rgba(240,184,128,0.35);font-size:0.88rem;line-height:1.45;margin-bottom:10px}
.pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:0.94rem;line-height:1.55;padding:12px 14px;border-radius:14px;background:var(--chip-bg);border:1px solid var(--chip-border)}
.pre.clamp{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.pre.clamp.open{display:block;overflow:visible}
.link{font-size:0.84rem;font-weight:700;color:var(--primary-ink,rgb(var(--primary-rgb)));min-height:36px;padding:0 2px}
.d-count{display:flex;justify-content:space-between;font-size:0.8rem;color:var(--faint)}
.btn.is-armed{background:rgba(var(--primary-rgb),0.16);color:var(--text);border:1px solid rgb(var(--primary-rgb));box-shadow:none}
.grade-card{display:flex;align-items:baseline;gap:8px;margin-bottom:10px}
.grade-big{font-family:'Syne',sans-serif;font-size:2.2rem;font-weight:800;line-height:1;color:var(--ok)}
.fb{margin:0;padding:12px 14px;border-radius:14px;border-left:3px solid rgb(var(--primary-rgb));background:rgba(var(--primary-rgb),0.10);font-size:0.94rem;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere}
blockquote.fb{margin-top:6px}
.sum{display:flex;align-items:center;flex-wrap:wrap;gap:8px 18px;padding:12px 14px;border-radius:14px;background:var(--chip-bg);border:1px solid var(--chip-border);font-size:0.9rem;margin-bottom:14px}
.sum b{font-family:'Syne',sans-serif;font-size:1.05rem}
.sum .btn{margin-left:auto}
.banner{padding:10px 12px;border-radius:12px;background:rgba(240,184,128,0.14);border:1px solid rgba(240,184,128,0.35);font-size:0.86rem;line-height:1.45;margin-bottom:12px}
.subs{list-style:none;display:flex;flex-direction:column;gap:12px}
.sub{padding:14px;border-radius:16px;background:var(--chip-bg);border:1px solid var(--chip-border)}
.sub-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.sub-head strong{flex:1;min-width:0;overflow-wrap:anywhere}
.av{width:32px;height:32px;border-radius:10px;flex:none;display:grid;place-items:center;background:linear-gradient(135deg,rgb(var(--primary-rgb)),rgb(var(--secondary-rgb)));color:var(--btn-ink);font-family:'Syne',sans-serif;font-weight:800;font-size:0.84rem}
.sub-grade{display:grid;grid-template-columns:130px 1fr;gap:10px;margin-top:12px}
.sub-grade .field{margin-bottom:0}
.sub-grade textarea{min-height:64px}
.sub-actions{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-top:10px}
.sub-actions .field-err{flex-basis:100%;min-height:0}
.miss{display:flex;flex-wrap:wrap;gap:6px}

@media(max-width:1000px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.grid{grid-template-columns:1fr}}
@media(max-width:900px){.main{padding:78px 16px 112px}}
@media(max-width:560px){
  .stats{grid-template-columns:1fr 1fr}
  .stat-value{font-size:1.45rem}
  .act{grid-template-columns:1fr}
  .act-side{flex-direction:row;align-items:center;justify-content:space-between;text-align:left;flex-wrap:wrap}
  .sub-grade,.d-meta{grid-template-columns:1fr}
  .search input{width:100%}
  .search{flex:1;min-width:100%}
}
@media (hover:hover) and (pointer:fine){
  .stat-btn:hover,.act:hover{transform:translateY(-2px)}
  .act:hover{border-color:rgba(var(--primary-rgb),0.45)}
  .fchip:hover,.gchip:hover{border-color:rgba(var(--primary-rgb),0.5);color:var(--text)}
  .fb-item:hover .fb-top{color:var(--primary-ink,rgb(var(--primary-rgb)))}
}
</style>
</head>
<body>

<div class="shell">
  <main class="main">
    <div class="main-inner">

      <section class="hero rise">
        <div>
          <div class="eyebrow">Seguimiento académico</div>
          <h1 class="title">Actividades</h1>
          <p class="subtitle" id="subtitle">Lo que necesitás saber, hacer y proyectar para tu grado.</p>
        </div>
        <div class="ctx" id="ctx" hidden>
          <label class="sr-only" for="schoolSelect">Escuela</label>
          <select class="select" id="schoolSelect"></select>
          <label class="sr-only" for="gradeSelect">Grado</label>
          <select class="select" id="gradeSelect"></select>
          <button class="btn-icon" id="refreshBtn" type="button" aria-label="Actualizar actividades" title="Actualizar">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>
          </button>
          <span class="updated" id="updatedAt" aria-live="off"></span>
          <button class="btn btn-primary" id="newBtn" type="button" hidden>Nueva actividad</button>
        </div>
      </section>

      <section id="app" aria-live="polite"></section>

    </div>
  </main>
</div>

<!-- Nueva actividad -->
<div class="dialog-wrap" id="newDlg">
  <div class="dialog-panel" role="dialog" aria-modal="true" aria-labelledby="newTitle">
    <div class="dlg-head"><h2 id="newTitle">Nueva actividad</h2><button class="dlg-close" type="button" data-close aria-label="Cerrar">×</button></div>
    <form id="newForm" novalidate>
      <div class="field"><label for="nTitle">Título</label><input id="nTitle" maxlength="100" autocomplete="off"><div class="field-err" id="nTitleErr"></div></div>
      <div class="field"><label for="nSubject">Materia</label><input id="nSubject" maxlength="60" autocomplete="off"></div>
      <div class="field"><label for="nType">Tipo</label>
        <select id="nType"><option value="tarea">Trabajo</option><option value="examen">Examen</option><option value="quiz">Quiz</option></select></div>
      <div class="field"><label for="nDue">Fecha de cierre (opcional)</label><input id="nDue" type="datetime-local"><div class="field-err" id="nDueErr"></div></div>
      <div class="field"><label for="nDesc">Consigna</label><textarea id="nDesc" maxlength="700" placeholder="Qué tienen que hacer, cómo se evalúa, qué materiales usar…"></textarea><div class="d-count"><span></span><span><span id="nDescCount">0</span>/700</span></div></div>
      <div class="field-err" id="newErr" role="alert"></div>
      <div style="display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap">
        <button class="btn btn-ghost" type="button" data-close>Cancelar</button>
        <button class="btn btn-primary" type="submit" id="publishBtn">Publicar</button>
      </div>
    </form>
  </div>
</div>

<!-- Detalle de actividad -->
<div class="dialog-wrap is-drawer" id="drawer">
  <div class="dialog-panel" role="dialog" aria-modal="true" aria-labelledby="drawerTitle" id="drawerPanel"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/api.js"></script>
<script src="js/aleph-shell.js?v=3"></script>
<script>
(function(){
'use strict';
/* Si falta algún archivo compartido, se dice qué pasa en vez de dejar la página vacía */
if(typeof AlephShell==='undefined'||typeof AlephAPI==='undefined'){
  var missing=typeof AlephShell==='undefined'?'js/aleph-shell.js':'js/api.js';
  document.getElementById('app').innerHTML='<div style="max-width:560px;padding:22px;border-radius:18px;border:1px solid rgba(240,128,128,.5);line-height:1.5"><b>No se pudo cargar la interfaz.</b><br>Falta el archivo <code>'+missing+'</code>. Revisá que esté subido y recargá la página.</div>';
  return;
}
const A=AlephShell,$=A.$,$$=A.$$,esc=A.esc,toast=A.toast;

/* ══════════════════════════════════════════
   ESTADO Y UTILIDADES
══════════════════════════════════════════ */
const S={user:null,schools:[],school:null,grade:null,data:null,filter:'all',q:'',openId:null,updatedAt:0,seq:0,
  goal:parseInt(localStorage.getItem('aleph_goal')||'7',10)||7,dirty:false,saved:{},members:{},feedbackBroken:false};
const TIPO={tarea:'Trabajo',examen:'Examen',quiz:'Quiz'};
const NF=new Intl.NumberFormat('es-AR',{minimumFractionDigits:1,maximumFractionDigits:1});
const fmtNota=n=>NF.format(Number(n));
const DF=new Intl.DateTimeFormat('es-AR',{day:'numeric',month:'short'});
const TF=new Intl.DateTimeFormat('es-AR',{hour:'2-digit',minute:'2-digit'});
const DFL=new Intl.DateTimeFormat('es-AR',{weekday:'long',day:'numeric',month:'long',hour:'2-digit',minute:'2-digit'});
const norm=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const isManager=()=>!!(S.data&&S.data.permissions&&S.data.permissions.canManage);
const acts=()=>(S.data&&S.data.activities)||[];
const ownSub=a=>(a.submissions&&a.submissions[0])||null;
const ungraded=a=>(a.submissions||[]).filter(s=>s.nota==null).length;
const findAct=id=>acts().find(a=>String(a.id)===String(id));
function dayDiff(d){const a=new Date(d);a.setHours(0,0,0,0);const b=new Date();b.setHours(0,0,0,0);return Math.round((a-b)/86400000);}
function countdown(iso){
  const ms=new Date(iso)-new Date();if(!(ms>0))return 'Venció';
  const m=Math.floor(ms/60000),d=Math.floor(m/1440),h=Math.floor((m%1440)/60),mm=m%60;
  if(d>0)return d+' d '+h+' h';if(h>0)return h+' h '+mm+' min';return mm+' min';
}
const ICON_CAL='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>';
const ICON_SEARCH='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>';

/* Estado de una actividad según quién la mira */
function dueInfo(a,manager){
  const own=manager?null:ownSub(a);
  if(own)return{bucket:'done',type:'done',done:true,label:own.nota==null?'Entregada':'Nota '+fmtNota(own.nota),sub:a.fecha_cierre?DF.format(new Date(a.fecha_cierre)):''};
  const d=a.fecha_cierre?new Date(a.fecha_cierre):null;
  if(!d||isNaN(d))return{bucket:'none',type:'normal',label:'Sin fecha',sub:''};
  if(d<new Date())return{bucket:'late',type:'late',label:manager?'Cerrada':'Vencida',sub:DF.format(d)};
  const diff=dayDiff(d);
  if(diff===0)return{bucket:'today',type:'urgent',label:'Hoy',sub:TF.format(d)};
  if(diff===1)return{bucket:'week',type:'urgent',label:'Mañana',sub:TF.format(d)};
  if(diff<=7)return{bucket:'week',type:'soon',label:'En '+diff+' días',sub:DF.format(d)};
  return{bucket:'later',type:'normal',label:DF.format(d),sub:''};
}
const BUCKETS=['late','today','week','later','none','done'];
const bucketLabel=(b,m)=>({late:m?'Cerradas':'Vencidas',today:'Hoy',week:'Esta semana',later:'Más adelante',none:'Sin fecha',done:'Entregadas'}[b]);
const chipFor=t=>({late:'err',urgent:'warn',soon:'warn',done:'ok'}[t]||'');
const rows=()=>{const m=isManager();return acts().map(a=>({a:a,i:dueInfo(a,m)}));};

const FILTERS={
  student:[['all','Todas'],['pending','Pendientes'],['delivered','Entregadas'],['graded','Calificadas'],['late','Vencidas']],
  manager:[['all','Todas'],['tograde','Por calificar'],['open','Abiertas'],['closed','Cerradas']]
};
function matchFilter(r,f){
  const a=r.a,own=ownSub(a);
  switch(f){
    case 'pending':return !own&&r.i.bucket!=='late';
    case 'delivered':return !!own;
    case 'graded':return !!own&&own.nota!=null;
    case 'late':return !own&&r.i.bucket==='late';
    case 'tograde':return ungraded(a)>0;
    case 'open':return r.i.bucket!=='late';
    case 'closed':return r.i.bucket==='late';
    default:return true;
  }
}

const SKELETON='<div class="stats sk">'+'<div class="skel" style="height:104px"></div>'.repeat(4)+'</div><div class="sk-list">'+'<div class="skel" style="height:76px"></div>'.repeat(4)+'</div>';

function emptyHTML(msg,clearable,icon){
  return '<div class="glass empty"><div class="empty-ic">'+(icon||ICON_CAL)+'</div><p>'+msg+'</p>'+(clearable?'<button type="button" class="btn btn-ghost btn-sm" data-clear>Quitar filtros</button>':'')+'</div>';
}
function errorCard(title,err,retryAttr){
  return '<div class="glass err-card" role="alert"><h3>'+esc(title)+'</h3><p>'+esc(A.friendlyError(err))+'</p><div class="gate-actions">'+
    (retryAttr?'<button type="button" class="btn btn-primary" '+retryAttr+'>Reintentar</button>':'')+'<a class="btn btn-ghost" href="dashboard.html">Volver al inicio</a></div></div>';
}

function statsHTML(){
  const m=isManager(),R=rows();
  const graded=m?acts().flatMap(a=>a.submissions||[]).filter(s=>s.nota!=null):R.map(r=>ownSub(r.a)).filter(s=>s&&s.nota!=null);
  const avg=graded.length?fmtNota(graded.reduce((t,s)=>t+Number(s.nota),0)/graded.length):'—';
  let cards;
  if(m){
    cards=[['tograde',acts().reduce((n,a)=>n+ungraded(a),0),'Por calificar','Entregas esperando tu revisión'],
      ['open',R.filter(r=>r.i.bucket!=='late').length,'Abiertas','Con fecha de cierre vigente'],
      ['all',acts().reduce((n,a)=>n+(a.submissions||[]).length,0),'Entregas recibidas','En todas las actividades'],
      [null,avg,'Promedio del grado','Sobre entregas calificadas']];
  }else{
    cards=[['pending',R.filter(r=>!ownSub(r.a)&&(r.i.bucket==='today'||r.i.bucket==='week')).length,'Para esta semana','Vencen en los próximos 7 días'],
      ['pending',R.filter(r=>matchFilter(r,'pending')).length,'Pendientes','Todavía sin entregar'],
      ['late',R.filter(r=>matchFilter(r,'late')).length,'Vencidas','Se pasó la fecha sin entrega'],
      [null,avg,'Tu promedio','Sobre entregas calificadas']];
  }
  return cards.map(c=>{
    const tag=c[0]?'button type="button" data-filter="'+c[0]+'"':'div',end=c[0]?'button':'div';
    return '<'+tag+' class="glass stat'+(c[0]?' stat-btn':'')+'"><span class="stat-label">'+c[2]+'</span><span class="stat-value">'+c[1]+'</span><span class="stat-detail">'+c[3]+'</span></'+end+'>';
  }).join('');
}
function toolbarHTML(){
  const f=FILTERS[isManager()?'manager':'student'];
  return '<div class="chips" role="group" aria-label="Filtrar actividades">'+f.map(x=>'<button type="button" class="fchip" data-chip="'+x[0]+'" aria-pressed="'+(S.filter===x[0])+'">'+x[1]+'<span class="n" data-n="'+x[0]+'"></span></button>').join('')+'</div>'+
    '<div class="search">'+ICON_SEARCH+'<label class="sr-only" for="q">Buscar actividades</label><input id="q" type="search" placeholder="Buscar (/)" value="'+esc(S.q)+'" autocomplete="off"></div>';
}
function updateChips(){
  const R=rows(),f=FILTERS[isManager()?'manager':'student'];
  f.forEach(x=>{const el=$('[data-n="'+x[0]+'"]');if(el)el.textContent=R.filter(r=>matchFilter(r,x[0])).length;});

}
function rowHTML(a,info){
  const m=isManager(),own=ownSub(a),id=esc(a.id),tipo=a.tipo||'tarea';
  let action='';
  if(m){const u=ungraded(a),t=(a.submissions||[]).length;
    action='<button type="button" class="btn btn-sm '+(u?'btn-primary':'btn-ghost')+'" data-open="'+id+'" data-focus="grade">'+(u?u+' por calificar':t+' entrega'+(t===1?'':'s'))+'</button>';}
  else if(own)action=own.comentario?'<span class="tchip ok">Con devolución</span>':(own.nota!=null?'<span class="tchip ok">Calificada</span>':'<span class="tchip">Entregada</span>');
  else action='<button type="button" class="btn btn-sm btn-primary" data-open="'+id+'" data-focus="deliver">Entregar</button>';

    '<div class="act-side"><span class="act-due '+info.type+'">'+esc(info.label)+'</span>'+(info.sub?'<span class="act-sub">'+esc(info.sub)+'</span>':'')+action+'</div></article>';

function listHTML(){
  const m=isManager(),q=norm(S.q);
  if(!acts().length)return emptyHTML('Todavía no hay actividades publicadas para este grado.'+(m?' Creá la primera con “Nueva actividad”.':' Cuando tu docente publique una, la vas a ver acá.'));
  const R=rows().filter(r=>matchFilter(r,S.filter)&&(!q||norm(r.a.titulo).includes(q)||norm(r.a.materia).includes(q)));
  if(!R.length)return emptyHTML(q?'Ninguna actividad coincide con “'+esc(S.q)+'”.':'No hay actividades en este filtro.',true);
  const groups={};R.forEach(r=>{(groups[r.i.bucket]=groups[r.i.bucket]||[]).push(r);});
  const t=r=>r.a.fecha_cierre?new Date(r.a.fecha_cierre).getTime():0;
  return BUCKETS.filter(b=>groups[b]).map(b=>{
    const g=groups[b].sort((x,y)=>(b==='late'||b==='done')?t(y)-t(x):(b==='none'?String(x.a.titulo).localeCompare(String(y.a.titulo)):t(x)-t(y)));
    return '<section class="group" aria-label="'+bucketLabel(b,m)+'"><h3 class="group-head">'+bucketLabel(b,m)+'<span>'+g.length+'</span></h3><div class="act-list">'+g.map(r=>rowHTML(r.a,r.i)).join('')+'</div></section>';
  }).join('');
}

/* Columna lateral */
function nextDue(){
  const now=new Date();
  return rows().filter(r=>!ownSub(r.a)&&r.a.fecha_cierre&&new Date(r.a.fecha_cierre)>now).sort((x,y)=>new Date(x.a.fecha_cierre)-new Date(y.a.fecha_cierre))[0]||null;
}
function roomHTML(){
  return '<section class="glass side-card"><h3 class="side-title">Sala de quiz</h3><div class="join"><label class="sr-only" for="roomCode">Código de sala</label><input id="roomCode" maxlength="8" placeholder="Código de sala" autocomplete="off" autocapitalize="characters" spellcheck="false"><button type="button" class="btn btn-primary" data-join>Unirme</button></div></section>';
}
function projectionHTML(){
  const g=S.goal,vals=acts().map(ownSub).filter(s=>s&&s.nota!=null).map(s=>Number(s.nota));
  const n=vals.length,sum=vals.reduce((a,b)=>a+b,0),avg=n?sum/n:null,need=g*(n+1)-sum;
  let msg;
  if(!n)msg='Todavía no hay entregas calificadas para proyectar.';
  else if(need<=0)msg='Ya superás tu meta de '+fmtNota(g)+'. Aunque la próxima nota sea baja, la mantenés.';
  else if(need<=10)msg='Para '+(avg>=g?'mantener':'llegar a')+' tu meta de '+fmtNota(g)+' necesitás al menos '+fmtNota(need)+' en la próxima.';
  else msg='Con una sola nota ya no alcanzás tu meta de '+fmtNota(g)+'. Hacen falta varias notas altas.';
  return '<section class="glass side-card"><h3 class="side-title">Proyección de notas</h3>'+
    '<div class="proj"><div class="proj-val">'+(n?fmtNota(avg):'—')+'</div><div class="proj-copy">'+msg+'</div></div>'+
    '<div class="gauge" role="img" aria-label="Promedio '+(n?fmtNota(avg):'sin datos')+' de 10, meta '+fmtNota(g)+'"><i style="width:'+(n?clampPct(avg*10):0)+'%"></i><b style="left:'+clampPct(g*10)+'%"></b></div>'+
    '<div class="goal-row" role="group" aria-label="Elegí tu meta"><span>Meta</span>'+[6,7,8,9].map(x=>'<button type="button" class="gchip" data-goal="'+x+'" aria-pressed="'+(x===g)+'">'+x+'</button>').join('')+'</div></section>';
}
const clampPct=v=>Math.max(0,Math.min(100,v));
function feedbackListHTML(){
  const list=acts().map(a=>({a:a,s:ownSub(a)})).filter(x=>x.s&&(x.s.comentario||x.s.nota!=null))
    .sort((x,y)=>(new Date(y.a.fecha_cierre||0))-(new Date(x.a.fecha_cierre||0))).slice(0,3);
  return '<section class="glass side-card"><h3 class="side-title">Devoluciones recientes</h3>'+(list.length?list.map(x=>
    '<button type="button" class="fb-item" data-open="'+esc(x.a.id)+'"><span class="fb-top"><span>'+esc(x.a.titulo)+'</span><span class="tchip ok">'+(x.s.nota!=null?fmtNota(x.s.nota):'Entregada')+'</span></span>'+
    '<span class="fb-snip">'+(x.s.comentario?esc(x.s.comentario):'Sin comentarios del docente.')+'</span></button>').join(''):
    '<p class="muted">Cuando tus docentes califiquen, vas a ver acá su devolución.</p>')+'</section>';
}
function sideStudent(){
  const nd=nextDue();
  const next=nd?'<section class="glass side-card"><h3 class="side-title">Próximo vencimiento</h3><div class="next-title">'+esc(nd.a.titulo)+'</div><div class="next-meta">'+esc(nd.a.materia||'Sin materia')+'</div><div class="countdown" data-countdown="'+esc(nd.a.fecha_cierre)+'">'+countdown(nd.a.fecha_cierre)+'</div><button type="button" class="btn btn-primary btn-sm" data-open="'+esc(nd.a.id)+'" data-focus="deliver">Abrir</button></section>'
    :'<section class="glass side-card"><h3 class="side-title">Próximo vencimiento</h3><p class="muted">No tenés vencimientos próximos. Buen momento para adelantar.</p></section>';
  return next+projectionHTML()+feedbackListHTML()+roomHTML();
}
function distribution(vals){
  const bins=[['0 a 4',0,4],['4 a 6',4,6],['6 a 8',6,8],['8 a 10',8,10.01]].map(b=>({l:b[0],n:vals.filter(v=>v>=b[1]&&v<b[2]).length}));
  const max=Math.max(1,...bins.map(b=>b.n));
  return '<div class="dist">'+bins.map(b=>'<div class="dist-row"><span>'+b.l+'</span><span class="dist-bar"><i style="width:'+(b.n/max*100)+'%"></i></span><span>'+b.n+'</span></div>').join('')+'</div>';
}
function sideManager(){
  const pend=acts().flatMap(a=>(a.submissions||[]).filter(s=>s.nota==null).map(s=>({a:a,s:s}))).slice(0,4);
  const vals=acts().flatMap(a=>a.submissions||[]).filter(s=>s.nota!=null).map(s=>Number(s.nota));
  return '<section class="glass side-card"><h3 class="side-title">Para calificar ahora</h3>'+(pend.length?pend.map(x=>
    '<button type="button" class="fb-item" data-open="'+esc(x.a.id)+'" data-focus="grade"><span class="fb-top"><span>'+esc(x.s.alumno_username)+'</span><span class="tchip warn">Sin calificar</span></span><span class="fb-snip">'+esc(x.a.titulo)+'</span></button>').join(''):
    '<p class="muted">No hay entregas pendientes de revisión.</p>')+'</section>'+
    '<section class="glass side-card"><h3 class="side-title">Rendimiento del grado</h3>'+(vals.length?'<div class="proj"><div class="proj-val">'+fmtNota(vals.reduce((a,b)=>a+b,0)/vals.length)+'</div><div class="proj-copy">Promedio sobre '+vals.length+' nota'+(vals.length===1?'':'s')+'.</div></div>'+distribution(vals):'<p class="muted">Todavía no hay notas cargadas.</p>')+'</section>'+roomHTML();
}

const visibleGrades=sc=>(sc.grades||[]).filter(g=>g.membershipRole||sc.membershipRole==='director');
function persistCtx(){try{localStorage.setItem('aleph_ctx',JSON.stringify({s:S.school&&S.school.id,g:S.grade&&S.grade.id}));}catch(e){}}
function pickInitialContext(){
  let saved={};try{saved=JSON.parse(localStorage.getItem('aleph_ctx')||'{}')||{};}catch(e){}
  S.school=S.schools.find(s=>String(s.id)===String(saved.s))||S.schools[0];
  const vg=visibleGrades(S.school);
  S.grade=vg.find(g=>String(g.id)===String(saved.g))||vg[0]||null;
}
function buildContext(){
  $('#ctx').hidden=false;
  const ss=$('#schoolSelect');
  ss.hidden=S.schools.length<2;
  ss.innerHTML=S.schools.map(s=>'<option value="'+esc(s.id)+'">'+esc(s.name)+'</option>').join('');
  ss.value=S.school.id;
  fillGrades();
}
function fillGrades(){
  const gs=$('#gradeSelect'),vg=visibleGrades(S.school);
  gs.innerHTML=vg.map(g=>'<option value="'+esc(g.id)+'">'+esc(g.name)+'</option>').join('');
  gs.hidden=vg.length<2;
  if(!(S.grade&&vg.some(g=>String(g.id)===String(S.grade.id))))S.grade=vg[0]||null;

function startLoad(){
  S.data=null;S.filter='all';S.q='';
  if(!S.grade){renderNoGrade();return;}
  loadActivities();
}
$('#schoolSelect').addEventListener('change',e=>{
  S.school=S.schools.find(s=>String(s.id)===e.target.value);S.grade=null;fillGrades();persistCtx();startLoad();
});
$('#gradeSelect').addEventListener('change',e=>{
  S.grade=visibleGrades(S.school).find(g=>String(g.id)===e.target.value);fillGrades();persistCtx();startLoad();
});

/* ══════════════════════════════════════════
   CARGA DE ACTIVIDADES (con tiempo máximo, reintento y datos previos a la vista)
══════════════════════════════════════════ */
async function loadActivities(o){
  o=o||{};const seq=++S.seq,btn=$('#refreshBtn');
  if(btn)btn.classList.add('is-spinning');
  if(!o.silent&&!S.data)showListLoading();
  try{
    const res=await A.withTimeout(AlephAPI.Institucion.getActividades(S.school.id,S.grade.id),45000);
    if(seq!==S.seq)return;
    if(!res||res.ok===false)throw new Error((res&&res.error)||'No se pudo cargar las actividades.');
    applyData(res);
  }catch(err){
    if(seq!==S.seq)return;
    if(S.data)toast(A.friendlyError(err),{kind:'err',action:{label:'Reintentar',onClick:()=>loadActivities(o)}});
    else showListError(err);
  }finally{
    if(seq===S.seq&&btn)btn.classList.remove('is-spinning');
  }
}
function updatedLabel(){
  if(!S.updatedAt)return '';
  const m=Math.floor((Date.now()-S.updatedAt)/60000);
  return m<1?'Actualizado recién':'Actualizado hace '+m+' min';
}
function updateUpdated(){const el=$('#updatedAt');if(el)el.textContent=updatedLabel();}
$('#refreshBtn').addEventListener('click',()=>{if(S.grade)loadActivities({silent:true});});
setInterval(()=>{
  updateUpdated();
  $$('[data-countdown]').forEach(el=>{el.textContent=countdown(el.dataset.countdown);});
},30000);
document.addEventListener('visibilitychange',()=>{
  if(!document.hidden&&S.data&&Date.now()-S.updatedAt>300000)loadActivities({silent:true});
});

function managerDrawer(a){

  return '<div class="sum"><div><b id="sumGraded">'+gr.length+'</b> de '+subs.length+' calificadas</div><div>Promedio <b id="sumAvg">'+avg+'</b></div>'+(subs.length?'<button type="button" class="btn btn-ghost btn-sm" data-csv>Exportar .csv</button>':'')+'</div>'+
    (S.feedbackBroken?'<div class="banner">El servidor todavía no guarda devoluciones: las notas sí se guardan. Hay que actualizar el backend (ver api-patch.js).</div>':'')+
    (subs.length?'<ul class="subs">'+subs.map((s,i)=>subHTML(s,i,subs.length)).join('')+'</ul>':'<p class="muted">Todavía no hay entregas.</p>')+
    '<div id="missing"></div>';
}
function openActivity(id,hint){
  const a=findAct(id);if(!a)return;
  S.openId=a.id;
  $('#drawerPanel').innerHTML=drawerHead(a)+drawerMeta(a)+
    '<h3 class="d-h">Consigna</h3><div class="pre">'+(a.descripcion?esc(a.descripcion):'<span class="muted">El docente no escribió una consigna.</span>')+'</div>'+
    (isManager()?managerDrawer(a):studentDelivery(a));
  A.openDialog($('#drawer'),{onClose:onDrawerClose,focus:'.dlg-close'});
  try{history.replaceState(null,'','#a='+encodeURIComponent(a.id));}catch(e){}
  if(isManager())loadMissing(a);
  if(hint==='deliver'){setTimeout(()=>{const t=$('#subText');if(t)t.focus();},80);}
  if(hint==='grade'){setTimeout(()=>{const t=$('.grade-in');if(t&&!(a.submissions||[]).every(s=>s.nota!=null))t.focus();},80);}
}
function onDrawerClose(){
  S.openId=null;
  try{history.replaceState(null,'',location.pathname+location.search);}catch(e){}
  if(S.dirty){S.dirty=false;loadActivities({silent:true});}
}
async function loadMissing(a){
  const gid=S.grade.id;
  if(!(gid in S.members)){
    try{const r=await A.withTimeout(AlephAPI.Schools.getMiembrosGrado(gid),12000);S.members[gid]=r&&r.ok?(r.members||[]):null;}
    catch(e){S.members[gid]=null;}
  }
  const mem=S.members[gid],box=$('#missing');
  if(!mem||!box||String(S.openId)!==String(a.id))return;
  const have=new Set((a.submissions||[]).map(s=>s.alumno_username));
  const miss=mem.filter(m=>((m.profiles&&m.profiles.role)||m.role)==='student').map(m=>m.profiles&&m.profiles.username).filter(u=>u&&!have.has(u));
  box.innerHTML=miss.length?'<h3 class="d-h">Sin entregar ('+miss.length+')</h3><div class="miss">'+miss.map(u=>'<span class="tchip">'+esc(u)+'</span>').join('')+'</div>':'';
}

/* Entrega del estudiante: borrador automático y confirmación (no se puede editar después) */
let armTimer=0,armed=false,draftTimer=0;
async function sendSubmission(btn){
  const a=findAct(S.openId);if(!a)return;
  const ta=$('#subText'),err=$('#subErr');
  err.textContent='';ta.removeAttribute('aria-invalid');
  const text=ta.value.trim();
  if(!text){err.textContent='Escribí tu entrega antes de continuar.';ta.setAttribute('aria-invalid','true');ta.focus();return;}
  if(!armed){
    armed=true;btn.classList.add('is-armed');btn.textContent='¿Confirmás? No se puede editar después';
    clearTimeout(armTimer);armTimer=setTimeout(()=>{armed=false;btn.classList.remove('is-armed');btn.textContent='Entregar';},5000);
    return;
  }
  clearTimeout(armTimer);armed=false;btn.disabled=true;btn.textContent='Entregando…';
  let res;
  try{res=await A.withTimeout(AlephAPI.Institucion.entregarActividad(S.school.id,S.grade.id,a.id,text),30000);}
  catch(e){res={ok:false,error:A.friendlyError(e)};}
  if(!res||res.ok===false){
    btn.disabled=false;btn.classList.remove('is-armed');btn.textContent='Entregar';
    err.textContent=(res&&res.error)||'No se pudo entregar. Probá de nuevo.';return;
  }
  try{localStorage.removeItem('aleph_draft_'+a.id);}catch(e){}
  a.submissions=[{id:'tmp-'+Date.now(),alumno_username:S.user.username,contenido:text,nota:null}]; /* se ve al instante; se confirma al refrescar */
  toast('Entrega enviada',{kind:'ok'});
  renderAll();openActivity(a.id);
  loadActivities({silent:true});
}

/* Calificación con devolución */
function parseNota(v){const n=Number(String(v).trim().replace(',','.'));return n;}
async function saveGrade(sid,goNext){
  const a=findAct(S.openId);if(!a)return;
  const li=$('[data-sid="'+CSS.escape(String(sid))+'"]');if(!li)return;
  const inp=$('.grade-in',li),fb=$('textarea',li),err=$('[data-err]',li);
  err.textContent='';inp.removeAttribute('aria-invalid');
  const nota=parseNota(inp.value);
  if(inp.value.trim()===''||!Number.isFinite(nota)||nota<0||nota>10){
    inp.setAttribute('aria-invalid','true');err.textContent='Escribí una nota entre 0 y 10.';inp.focus();return;
  }
  const comentario=fb.value.trim();
  $$('button',li).forEach(b=>{b.disabled=true;});
  let res;
  try{res=await A.withTimeout(AlephAPI.Institucion.calificarEntrega(S.school.id,S.grade.id,a.id,sid,nota,comentario||null),30000);}
  catch(e){res={ok:false,error:A.friendlyError(e)};}
  $$('button',li).forEach(b=>{b.disabled=false;});
  if(!res||res.ok===false){err.textContent=(res&&res.error)||'No se pudo guardar. Probá de nuevo.';return;}
  const s=(a.submissions||[]).find(x=>String(x.id)===String(sid));
  if(s){s.nota=nota;s.comentario=comentario||null;}
  S.saved[String(sid)]={aid:a.id,comentario:comentario};S.dirty=true;
  const chip=$('[data-state]',li);chip.className='tchip ok';chip.textContent='Nota '+fmtNota(nota);
  const gr=(a.submissions||[]).filter(x=>x.nota!=null);
  $('#sumGraded').textContent=gr.length;
  $('#sumAvg').textContent=gr.length?fmtNota(gr.reduce((t,x)=>t+Number(x.nota),0)/gr.length):'—';
  toast('Nota guardada',{kind:'ok',timeout:2200});
  if(goNext){const nx=li.nextElementSibling;if(nx){const t=$('.grade-in',nx);if(t){t.focus();nx.scrollIntoView&&nx.scrollIntoView({block:'nearest'});}}}
}
/* Si el backend todavía no guarda devoluciones, se avisa en vez de aparentar que se guardaron */
function verifyFeedback(){
  const keys=Object.keys(S.saved);if(!keys.length)return;
  let broken=false;
  keys.forEach(sid=>{
    const e=S.saved[sid],a=findAct(e.aid),s=a&&(a.submissions||[]).find(x=>String(x.id)===sid);
    if(s&&e.comentario&&s.comentario!==e.comentario)broken=true;
  });
  S.saved={};
  if(broken&&!S.feedbackBroken){S.feedbackBroken=true;toast('La nota se guardó, pero el servidor todavía no guarda devoluciones.',{kind:'warn',timeout:9000});}
}
function exportCsv(a){
  const q=c=>'"'+String(c==null?'':c).replace(/"/g,'""')+'"';
  const lines=[['Estudiante','Entrega','Nota','Devolución']].concat((a.submissions||[]).map(s=>[s.alumno_username,s.contenido,s.nota==null?'':String(s.nota).replace('.',','),s.comentario]));
  const csv='\ufeff'+lines.map(r=>r.map(q).join(';')).join('\r\n');
  const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
  const l=document.createElement('a');l.href=url;l.download=(norm(a.titulo).replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'actividad')+'.csv';
  document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);
}

/* ══════════════════════════════════════════
   NUEVA ACTIVIDAD
══════════════════════════════════════════ */
$('#newBtn').addEventListener('click',()=>{
  $('#newForm').reset();$('#nDescCount').textContent='0';
  ['newErr','nTitleErr','nDueErr'].forEach(id=>{$('#'+id).textContent='';});
  A.openDialog($('#newDlg'),{focus:'#nTitle'});
});
$('#nDesc').addEventListener('input',e=>{$('#nDescCount').textContent=e.target.value.length;});
$('#newForm').addEventListener('submit',async e=>{
  e.preventDefault();
  const title=$('#nTitle').value.trim(),dueRaw=$('#nDue').value,btn=$('#publishBtn');
  ['newErr','nTitleErr','nDueErr'].forEach(id=>{$('#'+id).textContent='';});
  $('#nTitle').removeAttribute('aria-invalid');$('#nDue').removeAttribute('aria-invalid');
  if(!title){$('#nTitleErr').textContent='Necesitás un título.';$('#nTitle').setAttribute('aria-invalid','true');$('#nTitle').focus();return;}
  if(dueRaw&&new Date(dueRaw)<new Date()){$('#nDueErr').textContent='La fecha de cierre ya pasó. Elegí una futura o dejala vacía.';$('#nDue').setAttribute('aria-invalid','true');$('#nDue').focus();return;}
  btn.disabled=true;btn.textContent='Publicando…';
  let res;
  try{res=await A.withTimeout(AlephAPI.Institucion.crearActividad(S.school.id,S.grade.id,{
    titulo:title,materia:$('#nSubject').value.trim()||null,tipo:$('#nType').value,
    fechaCierre:dueRaw?new Date(dueRaw).toISOString():null,descripcion:$('#nDesc').value.trim()}),30000);}
  catch(err){res={ok:false,error:A.friendlyError(err)};}
  btn.disabled=false;btn.textContent='Publicar';
  if(!res||res.ok===false){$('#newErr').textContent=(res&&res.error)||'No se pudo publicar. Probá de nuevo.';return;}
  A.closeDialog($('#newDlg'));
  toast('Actividad publicada',{kind:'ok'});
  S.filter='all';loadActivities({silent:true});
});

/* ══════════════════════════════════════════
   EVENTOS
══════════════════════════════════════════ */
$('#app').addEventListener('click',e=>{
  const t=e.target.closest('[data-open],[data-filter],[data-chip],[data-goal],[data-clear],[data-retry-list],[data-join]');
  if(t){
    if(t.hasAttribute('data-open'))openActivity(t.dataset.open,t.dataset.focus);
    else if(t.hasAttribute('data-filter')){S.filter=t.dataset.filter;renderList();const l=$('#list');l&&l.scrollIntoView&&l.scrollIntoView({behavior:A.reducedMotion()?'auto':'smooth',block:'start'});}
    else if(t.hasAttribute('data-chip')){S.filter=t.dataset.chip;renderList();}
    else if(t.hasAttribute('data-goal')){S.goal=parseInt(t.dataset.goal,10);try{localStorage.setItem('aleph_goal',String(S.goal));}catch(err){}$('#side').innerHTML=sideManagerOrStudent();}
    else if(t.hasAttribute('data-clear')){S.filter='all';S.q='';const q=$('#q');if(q)q.value='';renderList();}
    else if(t.hasAttribute('data-retry-list'))loadActivities();
    else if(t.hasAttribute('data-join')){
      const code=($('#roomCode').value||'').trim().toUpperCase();
      if(code)location.href='quiz-jugar.html?code='+encodeURIComponent(code);else $('#roomCode').focus();
    }
    return;
  }
  const row=e.target.closest('.act');
  if(row&&!e.target.closest('button,a'))openActivity(row.dataset.row);
});
$('#app').addEventListener('input',e=>{if(e.target.id==='q'){S.q=e.target.value;renderList();}});
$('#app').addEventListener('keydown',e=>{if(e.target.id==='roomCode'&&e.key==='Enter'){e.preventDefault();$('[data-join]').click();}});

$('#drawerPanel').addEventListener('click',e=>{
  const t=e.target.closest('[data-close],#sendSub,[data-save],[data-save-next],[data-expand],[data-csv]');
  if(!t)return;
  if(t.hasAttribute('data-close'))A.closeDialog($('#drawer'));
  else if(t.id==='sendSub')sendSubmission(t);
  else if(t.hasAttribute('data-save'))saveGrade(t.dataset.save,false);
  else if(t.hasAttribute('data-save-next'))saveGrade(t.dataset.saveNext,true);
  else if(t.hasAttribute('data-expand')){const p=t.previousElementSibling;if(p){const open=p.classList.toggle('open');t.textContent=open?'Ver menos':'Ver completo';}}
  else if(t.hasAttribute('data-csv')){const a=findAct(S.openId);if(a)exportCsv(a);}
});
$('#drawerPanel').addEventListener('input',e=>{
  if(e.target.id!=='subText')return;
  $('#subCount').textContent=e.target.value.length;
  clearTimeout(draftTimer);
  draftTimer=setTimeout(()=>{try{localStorage.setItem('aleph_draft_'+S.openId,e.target.value);const n=$('#draftNote');if(n)n.textContent='Borrador guardado';}catch(err){}},400);
});
$('#drawerPanel').addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&e.key==='Enter'){const li=e.target.closest('.sub');if(li){e.preventDefault();saveGrade(li.dataset.sid,false);}}
});
$$('#newDlg [data-close]').forEach(b=>b.addEventListener('click',()=>A.closeDialog($('#newDlg'))));
document.addEventListener('keydown',e=>{
  if(e.key==='/'&&!/^(INPUT|TEXTAREA|SELECT)$/.test((document.activeElement||{}).tagName||'')&&$('#q')){e.preventDefault();$('#q').focus();}
});

/* ══════════════════════════════════════════
   ARRANQUE: carga por etapas, siempre con salida
══════════════════════════════════════════ */
async function init(){
  A.mount({active:'actividades'});
  A.ready(); /* la cubierta se va enseguida: lo primero que se ve es qué se está cargando, nunca una pantalla vacía */
  const gate=A.stages($('#app'),[
    {id:'session',label:'Verificando tu sesión'},
    {id:'context',label:'Conectando con tu escuela'},
    {id:'acts',label:'Cargando tus actividades'}
  ],{title:'Preparando tus actividades',skeleton:SKELETON});

  await gate.run('session',()=>AlephAPI.Auth.init(),{timeoutMs:20000});
  S.user=AlephAPI.Auth.getCurrentUser();
  if(!S.user){location.href='index.html';return;}
  A.setUser(S.user);

  const ctx=await gate.run('context',()=>AlephAPI.Institucion.getContexto(),{timeoutMs:50000});
  S.schools=ctx.schools||[];
  if(!S.schools.length){gate.stop();renderNoSchool(ctx);return;}
  pickInitialContext();buildContext();persistCtx();
  if(!S.grade){gate.stop();renderNoGrade();return;}

  const res=await gate.run('acts',()=>AlephAPI.Institucion.getActividades(S.school.id,S.grade.id),{timeoutMs:50000});
  gate.stop();
  applyData(res);
  const m=/#a=([^&]+)/.exec(location.hash);
  if(m&&findAct(decodeURIComponent(m[1])))openActivity(decodeURIComponent(m[1]));
}
init().catch(err=>{
  console.error('Actividades:',err);
  $('#app').innerHTML=errorCard('Algo salió mal al abrir Actividades',err,'onclick="location.reload()"');
});
})();
</script>
